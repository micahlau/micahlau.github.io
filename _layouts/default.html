<!DOCTYPE html>
<html lang="en-us" class="h-100">
  <head>
    <title>
      {% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{
      site.description }}
    </title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The page supports both dark and light color schemes, and the page author prefers / default is light. -->
    <meta name="color-scheme" content="dark light" />
    <!-- Stylesheet that includes Bootstrap dark mode & custom stylesheet -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/styles.css' | relative_url }}"
    />
    <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" />
    <!-- Meta Theme Color is also supported on Safari and Chrome -->
    <meta
      name="theme-color"
      content="#eeeeee"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#111111"
      media="(prefers-color-scheme: light)"
    />
    <!-- Lightbox styles -->
    <style>
      #lightbox-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
      }
      #lightbox-overlay.open { display: flex; }
      #lightbox-overlay img {
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 4px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        cursor: default;
      }
      #lightbox-close {
        position: fixed;
        top: 1rem;
        right: 1.25rem;
        color: white;
        font-size: 2.5rem;
        line-height: 1;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        opacity: 0.8;
      }
      #lightbox-close:hover { opacity: 1; }
      .body img { cursor: zoom-in; }
    </style>
    {% seo %} {% feed_meta %} {%- if jekyll.environment == 'production' and
    site.google_analytics -%} {%- include google-analytics.html -%} {%- endif
    -%}
  </head>
  <body class="d-flex flex-column h-100">
    <!-- Lightbox overlay -->
    <div id="lightbox-overlay" role="dialog" aria-modal="true">
      <button id="lightbox-close" aria-label="Close">&times;</button>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <div class="container">
      {% include navigation.html %}
      <div class="body">{{ content }}</div>
    </div>
    {% include footer.html %}
    <!-- JS for Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- Lightbox script -->
    <script>
      (function () {
        const overlay = document.getElementById('lightbox-overlay');
        const overlayImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close');

        function openLightbox(src, alt) {
          overlayImg.src = src;
          overlayImg.alt = alt || '';
          overlay.classList.add('open');
        }

        function closeLightbox() {
          overlay.classList.remove('open');
          overlayImg.src = '';
        }

        // Attach click handlers to all images in the content area
        document.querySelectorAll('.body img').forEach(function (img) {
          img.addEventListener('click', function (e) {
            openLightbox(img.src, img.alt);
          });
        });

        // Close on overlay background click
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) closeLightbox();
        });

        // Close on X button
        closeBtn.addEventListener('click', closeLightbox);

        // Close on Escape key
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeLightbox();
        });
      })();
    </script>
  </body>
</html>
